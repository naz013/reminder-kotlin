name: Dependency Review

on:
  pull_request:
    branches:
      - 'master'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v7

    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high
