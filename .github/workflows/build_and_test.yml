name: Build and Test

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  schedule:
    # test_e2e only (see its `if:` below) - nightly, 02:00 UTC. Scheduled workflows always run
    # against the default branch (master), so no separate branch filter is needed here.
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run Detekt static analysis
      run: ./gradlew detekt detektReportMerge --continue -x :admin:cloudtestadmin:detekt -x :admin:reviewsadmin:detekt
      continue-on-error: true

    - name: Upload Detekt SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: build/reports/detekt/merge.sarif
        category: detekt

  test_android:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run all unit tests (Android modules)
      run: ./gradlew testProDebugUnitTest --continue -x :admin:cloudtestadmin:testDebugUnitTest -x :admin:reviewsadmin:testDebugUnitTest

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the tests fail
      with:
        report_paths: '**/build/test-results/**/TEST-*.xml'
        detailed_summary: true
        include_passed: false
        check_name: 'Android Unit Test Results'
        summary: true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-android
        path: |
          **/build/test-results/**/*.xml
          **/build/test-results/**/*.html
        retention-days: 30

    - name: Upload Test Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports-android
        path: |
          **/build/reports/tests/**
        retention-days: 30

  test_kotlin_and_coverage:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run all unit tests (Kotlin modules)
      run: ./gradlew test --continue -x :admin:cloudtestadmin:test -x :admin:reviewsadmin:test -x :admin:reviews:test

    - name: Generate coverage report
      run: ./gradlew koverXmlReport --continue -x :admin:cloudtestadmin:koverXmlReport -x :admin:reviewsadmin:koverXmlReport
      if: always()

    - name: Publish coverage to PR comment
      uses: mi-kas/kover-report@v2
      if: always() && github.event.before != '0000000000000000000000000000000000000000'
      with:
        path: ${{ github.workspace }}/build/reports/kover/report.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Coverage Report
        update-comment: true
        min-coverage-overall: 0
        min-coverage-changed-files: 0

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the tests fail
      with:
        report_paths: '**/build/test-results/**/TEST-*.xml'
        detailed_summary: true
        include_passed: false
        check_name: 'Kotlin Unit Test Results'
        summary: true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-kotlin
        path: |
          **/build/test-results/**/*.xml
          **/build/test-results/**/*.html
        retention-days: 30

    - name: Upload Test Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports-kotlin
        path: |
          **/build/reports/tests/**
        retention-days: 30

  test_e2e:
    # Nightly only, not on every push/PR (emulator runs are slow and this job is still a small
    # first batch - see docs/e2e-testing.md #6) - triggered by the `schedule` entry above.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level default entirely for this job, so every
    # permission it needs (checks:write for the JUnit report, issues:write for the
    # open-on-failure/close-on-recovery steps below) has to be listed here explicitly.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Cache AVD
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-34-v1

    - name: Build debug APK and test APK
      run: ./gradlew :app:assembleProDebug :app:assembleProDebugAndroidTest

    - name: Install Maestro
      run: |
        curl -fsSL "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Run instrumented tests + Maestro flows
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: |
          adb shell pm grant com.cray.software.justreminderpro android.permission.POST_NOTIFICATIONS || true
          ./gradlew connectedProDebugAndroidTest --continue
          adb install -r app/build/outputs/apk/pro/debug/app-pro-debug.apk
          maestro test --include-tags notifications .maestro/

    - name: Publish Compose UI Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: '**/build/outputs/androidTest-results/connected/**/*.xml'
        detailed_summary: true
        include_passed: false
        check_name: 'E2E Test Results (API 34)'
        summary: true

    - name: Upload Maestro artifacts (screenshots/logs on failure)
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: maestro-failure-34
        path: ~/.maestro/tests/
        retention-days: 14

    # The two steps below keep a single persistent issue (labeled e2e-nightly-failure) as the
    # nightly e2e status: opened/reopened with a new comment each time this job fails, closed with
    # a comment the first time it goes green again. This surfaces "did last night's merge break
    # e2e" without anyone having to go trawl the Actions run history for the first red run.
    - name: Open or update nightly e2e failure issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const label = 'e2e-nightly-failure';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: 'd73a4a',
              description: 'Nightly e2e (test_e2e) run failed on master',
            });
          } catch (error) {
            if (error.status !== 422) throw error; // 422 = label already exists
          }

          const lastGoodRuns = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'build_and_test.yml',
            event: 'schedule',
            status: 'success',
            per_page: 1,
          });
          const lastGoodSha = lastGoodRuns.data.workflow_runs[0]?.head_sha;
          const compareLine = lastGoodSha
            ? `Commits since the last green nightly run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/${lastGoodSha}...${context.sha}`
            : '(No previous successful nightly run found to compare against.)';

          const body = [
            `Nightly e2e run failed: ${runUrl}`,
            `Commit: ${context.sha}`,
            compareLine,
          ].join('\n\n');

          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: label,
            state: 'all',
            per_page: 1,
          });

          if (existing.data.length > 0) {
            const issue = existing.data[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
            if (issue.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open',
              });
            }
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly e2e tests are failing',
              labels: [label],
              body,
            });
          }

    - name: Close nightly e2e failure issue if recovered
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const label = 'e2e-nightly-failure';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const open = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: label,
            state: 'open',
            per_page: 1,
          });

          if (open.data.length > 0) {
            const issue = open.data[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Nightly e2e run passed again: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
          }
