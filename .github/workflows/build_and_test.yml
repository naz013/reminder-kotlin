name: Build and Test

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'release/**'
  pull_request:
    branches:
      - 'master'
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run Detekt static analysis
      run: ./gradlew detekt detektReportMerge --continue -x :cloudtestadmin:detekt -x :reviewsadmin:detekt
      continue-on-error: true

    - name: Upload Detekt SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: build/reports/detekt/merge.sarif
        category: detekt

  test_android:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run all unit tests (Android modules)
      run: ./gradlew testProDebugUnitTest --continue -x :cloudtestadmin:testDebugUnitTest -x :reviewsadmin:testDebugUnitTest

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the tests fail
      with:
        report_paths: '**/build/test-results/**/TEST-*.xml'
        detailed_summary: true
        include_passed: false
        check_name: 'Android Unit Test Results'
        summary: true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-android
        path: |
          **/build/test-results/**/*.xml
          **/build/test-results/**/*.html
        retention-days: 30

    - name: Upload Test Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports-android
        path: |
          **/build/reports/tests/**
        retention-days: 30

  test_kotlin_and_coverage:
    runs-on: ubuntu-latest
    steps:

    - name: Clone repo
      uses: actions/checkout@v7

    - name: Setup build
      uses: ./.github/actions/setup-build
      with:
        google-services-pro: ${{ secrets.GOOGLE_SERVICES }}
        google-services-free: ${{ secrets.GOOGLE_SERVICES_FREE }}
        google-services-cloudtestadmin: ${{ secrets.GOOGLE_SERVICES }}

    - name: Run all unit tests (Kotlin modules)
      run: ./gradlew test --continue -x :cloudtestadmin:test -x :reviewsadmin:test -x :reviews:test

    - name: Generate coverage report
      run: ./gradlew koverXmlReport --continue -x :cloudtestadmin:koverXmlReport -x :reviewsadmin:koverXmlReport
      if: always()

    - name: Publish coverage to PR comment
      uses: mi-kas/kover-report@v2
      if: always() && github.event.before != '0000000000000000000000000000000000000000'
      with:
        path: ${{ github.workspace }}/build/reports/kover/report.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Coverage Report
        update-comment: true
        min-coverage-overall: 0
        min-coverage-changed-files: 0

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the tests fail
      with:
        report_paths: '**/build/test-results/**/TEST-*.xml'
        detailed_summary: true
        include_passed: false
        check_name: 'Kotlin Unit Test Results'
        summary: true

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-kotlin
        path: |
          **/build/test-results/**/*.xml
          **/build/test-results/**/*.html
        retention-days: 30

    - name: Upload Test Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports-kotlin
        path: |
          **/build/reports/tests/**
        retention-days: 30
