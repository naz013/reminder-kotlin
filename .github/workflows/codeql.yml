name: CodeQL

on:
  push:
    branches:
      - 'master'
      - 'develop'
  pull_request:
    branches:
      - 'master'
      - 'develop'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Clone repo
      uses: actions/checkout@v7

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # build-mode: none only extracts Java; this project is almost entirely Kotlin,
    # so CodeQL needs an actual compile (build-mode: manual) to see any code.
    # These are placeholder values (no real secrets involved) purely so the
    # google-services Gradle plugin has a file to read during configuration -
    # this keeps the workflow secret-free and safe to run on fork PRs.
    - name: Create placeholder google-services.json files
      run: |
        cat > /tmp/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "codeql-placeholder",
            "storage_bucket": "codeql-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "PKG" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "placeholder" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        EOF
        sed 's/PKG/com.cray.software.justreminderpro/' /tmp/google-services.json > app/src/pro/google-services.json
        sed 's/PKG/com.cray.software.justreminder/' /tmp/google-services.json > app/src/free/google-services.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build (compile everything CodeQL needs to see)
      run: |
        ./gradlew testProDebugUnitTest --continue -x :cloudtestadmin:testDebugUnitTest -x :reviewsadmin:testDebugUnitTest
        ./gradlew test --continue -x :cloudtestadmin:test -x :reviewsadmin:test -x :reviews:test

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: '/language:java-kotlin'
